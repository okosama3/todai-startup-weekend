<style>
  :root {
    /* EQUES ブランドカラー（ロゴ実測値） */
    --blue:    #0071BC;
    --sky:     #54A0D2;
    --navy:    #1B1464;
    --violet:  #666197;
    --indigo:  #2E3192;
    --peri:    #7375B6;
    --action:  #1E00C7;

    --paper:   #FFFFFF;
    --mist:    #F4F6FB;
    --haze:    #E9EEF7;
    --line:    #DCE3F0;
    --deep:    #12103F;
    --text:    #1E2138;
    --muted:   #6B7391;
    color-scheme: light;
  }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .font-display { font-family: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif; font-weight: 400; }
  .font-mono-ui { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, monospace; }
  .tnum { font-variant-numeric: tabular-nums; }
  .balance { text-wrap: balance; }

  .wash {
    background:
      radial-gradient(ellipse 58% 70% at 88% 6%, rgba(84,160,210,.20), transparent 62%),
      radial-gradient(ellipse 52% 60% at 4% 88%, rgba(115,117,182,.16), transparent 64%),
      linear-gradient(180deg, #FFFFFF 0%, #F4F6FB 100%);
  }
  .wash-deep {
    background:
      radial-gradient(ellipse 60% 70% at 82% 0%, rgba(46,49,146,.75), transparent 60%),
      radial-gradient(ellipse 50% 60% at 6% 100%, rgba(0,113,188,.45), transparent 62%),
      #12103F;
  }
  .grid-lines {
    background-image: linear-gradient(to right, rgba(27,20,100,.055) 1px, transparent 1px);
    background-size: 84px 100%;
  }
  .grid-lines-inv {
    background-image: linear-gradient(to right, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 84px 100%;
  }

  .btn-action {
    background: var(--action);
    color: #fff;
    transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    box-shadow: 0 10px 26px -14px rgba(30,0,199,.85);
  }
  .btn-action:hover { background: #2E3192; transform: translateY(-2px); box-shadow: 0 18px 34px -16px rgba(30,0,199,.9); }
  .btn-action:active { transform: translateY(0); }

  .btn-invert {
    background: #fff;
    color: var(--navy);
    transition: transform .18s ease, box-shadow .18s ease;
    box-shadow: 0 10px 30px -14px rgba(0,0,0,.6);
  }
  .btn-invert:hover { transform: translateY(-2px); box-shadow: 0 18px 38px -16px rgba(0,0,0,.7); }
  .btn-invert:active { transform: translateY(0); }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--action);
    outline-offset: 3px;
  }
  .on-deep a:focus-visible, .on-deep button:focus-visible { outline-color: #8FB6E6; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .3; transform: scale(.8); }
  }
  .dot-live { animation: pulse-dot 1.9s ease-in-out infinite; }
  @keyframes float-y {
    0% { transform: translate3d(0,0,0); }
    100% { transform: translate3d(0,-14px,0); }
  }
  .drift { animation: float-y 7s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .dot-live, .drift { animation: none; }
    .btn-action, .btn-invert { transition: none; }
  }
  ::selection { background: rgba(30,0,199,.18); }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const IMG = window.__IMG__;

/* EQUES ロゴに由来する 6 ブロックのカラーシークエンス */
const BRAND = ["#0071BC", "#54A0D2", "#1B1464", "#666197", "#2E3192", "#7375B6"];

/* エントリーフォーム（Google フォーム） */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScXo6gh9ooQVhVgIipxGnX8uSMIKB7V8dajQpbke_kegKaXgw/viewform";
const FORM_EMBED = FORM_URL + "?embedded=true";

/* ---------- Lucide icon ---------- */
function Icon({ name, size = 20, className = "", strokeWidth = 1.75 }) {
  const node = (window.lucide && window.lucide.icons && window.lucide.icons[name]) || null;
  if (!node) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} aria-hidden="true" focusable="false">
      {node.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
    </svg>
  );
}

/* ---------- 6ブロックのマーク（EQUES のモチーフを継承した本イベントの記号） ---------- */
function BlockMark({ size = 18, lit = -1, mono = false }) {
  const u = size / 3;
  const cells = [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2], [1, 2]];
  return (
    <svg width={size * 2 / 3} height={size} viewBox={`0 0 ${u * 2} ${u * 3}`} aria-hidden="true" className="shrink-0">
      {cells.map(([cx, cy], i) => {
        const dim = lit >= 0 && i !== lit;
        return (
          <rect key={i} x={cx * u} y={cy * u} width={u - 0.6} height={u - 0.6}
            fill={mono ? "#FFFFFF" : BRAND[i]}
            opacity={dim ? 0.22 : mono ? 0.9 : 1} />
        );
      })}
    </svg>
  );
}

/* ---------- カウントダウン ---------- */
const KICKOFF = new Date("2026-10-02T18:00:00+09:00");

function Countdown() {
  const calc = () => {
    const ms = KICKOFF - new Date();
    if (ms <= 0) return null;
    const s = Math.floor(ms / 1000);
    return { d: Math.floor(s / 86400), h: Math.floor((s % 86400) / 3600), m: Math.floor((s % 3600) / 60), s: s % 60 };
  };
  const [t, setT] = useState(calc);
  useEffect(() => {
    const id = setInterval(() => setT(calc()), 1000);
    return () => clearInterval(id);
  }, []);
  const cells = t ? [["DAYS", t.d], ["HOURS", t.h], ["MIN", t.m], ["SEC", t.s]]
                  : [["DAYS", 0], ["HOURS", 0], ["MIN", 0], ["SEC", 0]];
  return (
    <div className="wash-deep on-deep rounded-[4px] overflow-hidden shadow-[0_24px_60px_-30px_rgba(27,20,100,.65)]">
      <div className="flex items-center gap-2 border-b border-white/10 px-5 py-3">
        <span className="h-1.5 w-1.5 rounded-full bg-sky dot-live" />
        <span className="font-mono-ui text-[11px] tracking-[.18em] uppercase text-white/60">
          {t ? "Kickoff まで" : "開催中"}
        </span>
        <span className="ml-auto font-mono-ui text-[11px] tracking-[.1em] text-sky">10/02 18:00</span>
      </div>
      <div className="grid grid-cols-4 divide-x divide-white/10">
        {cells.map(([label, v]) => (
          <div key={label} className="px-2 py-5 text-center">
            <div className="font-display tnum text-[28px] sm:text-[34px] leading-none text-white">{String(v).padStart(2, "0")}</div>
            <div className="mt-2 font-mono-ui text-[10px] tracking-[.16em] text-white/45">{label}</div>
          </div>
        ))}
      </div>
      <div className="border-t border-white/10 px-5 py-3.5">
        <p className="font-mono-ui text-[11px] leading-relaxed text-white/60">
          2泊3日 / 72時間 — アイデアから<span className="text-sky">動くMVP</span>まで。
        </p>
      </div>
    </div>
  );
}

/* ---------- 追従CTA ---------- */
function FloatingCta() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      const entry = document.getElementById("entry");
      const nearEntry = entry ? entry.getBoundingClientRect().top < window.innerHeight * 0.9 : false;
      setShow(window.scrollY > 560 && !nearEntry);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);
  return (
    <div className={`fixed inset-x-0 bottom-0 z-50 transition-all duration-300 sm:inset-x-auto sm:bottom-7 sm:right-7 ${show ? "translate-y-0 opacity-100" : "pointer-events-none translate-y-5 opacity-0"}`} aria-hidden={!show}>
      <div className="border-t border-line bg-white/95 px-4 py-3 backdrop-blur-md sm:rounded-[4px] sm:border sm:px-4 sm:py-3.5 sm:shadow-[0_20px_50px_-24px_rgba(27,20,100,.55)]">
        <div className="mx-auto flex max-w-content items-center gap-4">
          <div className="hidden sm:flex flex-col">
            <span className="font-mono-ui text-[10px] tracking-[.16em] text-muted">10.02 – 10.04 / 定員 9〜12名</span>
            <span className="text-[13px] font-bold text-navy">席が埋まる前に。</span>
          </div>
          <EntryButton className="w-full sm:w-auto" />
        </div>
      </div>
    </div>
  );
}

}
